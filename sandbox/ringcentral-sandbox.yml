generated: '2026-06-20'
method: searched
source: https://developers.ringcentral.com/guide/basics/development
description: >-
  RingCentral separates a free Sandbox (developer test) environment from
  Production. Apps are created and iterated in Sandbox, then go through a graduation
  process to obtain Production credentials. Sandbox has its own hosts, its own user
  accounts, and its own app credentials distinct from Production.
environments:
  - name: Sandbox
    api_host: https://platform.devtest.ringcentral.com
    media_host: https://media.devtest.ringcentral.com
    console: https://developers.ringcentral.com/console
    login: https://service.devtest.ringcentral.com/
    notes: >-
      Free developer environment. Every app starts here. Sandbox accounts come with
      test extensions/phone numbers provisioned in the Developer Console; credentials
      are per-app and never valid against Production.
  - name: Production
    api_host: https://platform.ringcentral.com
    media_host: https://media.ringcentral.com
    notes: >-
      Requires app graduation (Production credentials issued after review). Some
      scopes are gated (requires_permission) and only granted on request.
test_data:
  note: >-
    RingCentral does not publish universal magic test numbers the way an SMS-only
    provider does; test phone numbers and extensions are the ones provisioned inside
    your own Sandbox account. SMS/fax in Sandbox is delivered only between numbers on
    the same Sandbox account. Never treat Sandbox numbers as portable fixtures.
graduation:
  docs: https://developers.ringcentral.com/guide/basics/production
  summary: Submit the app for graduation to receive Production credentials.
