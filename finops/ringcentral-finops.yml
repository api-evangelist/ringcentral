principles:
  - name: Visibility
    description: >-
      Pull invoice exports and Admin Portal usage reports into your cost-allocation pipeline. RingCentral does not expose a public FOCUS-formatted feed; for very large accounts request a custom usage export from your account team.
  - name: Allocation
    description: >-
      Tag seats by department/cost-center via the Admin Portal and reconcile against your HRIS to chargeback by team. Add-ons should be allocated to the function that uses them (e.g., contact-center add-ons to the support BU).
  - name: Optimization
    description: >-
      Right-size seat tier (Core vs Advanced vs Ultra) per persona; reclaim seats for terminated employees promptly; consolidate add-ons where overlapping; renegotiate at renewal once usage data is in hand.
  - name: Accountability
    description: >-
      Designate a contract owner per RingCentral agreement; review monthly invoices against forecast; track international and SMS overages as leading indicators of plan-tier mismatch.
