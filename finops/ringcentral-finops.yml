description: >-
  RingCentral's billing surface is a per-seat SaaS subscription model (RingEX Core/Advanced/Ultra and RingCX agent seats) with usage-priced overages for international calling, SMS/MMS volume, fax pages, and toll-free minutes. The developer API itself is not metered — costs flow through the underlying RingEX/RingCX subscription consumed by the application. Add-on subscriptions (AI Receptionist, SMS Booster, Call Queues Booster, AI Conversation Expert) are flat monthly fees layered on top of seat counts.
notes: >-
  Reconciled against RingCentral published pricing as of 2026-05-08. RingCentral does not publish a public FOCUS-formatted billing export; usage detail is available via the Admin Portal and Cost Management exports for enterprise contracts.
