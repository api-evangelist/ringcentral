aid: ringcentral
url: https://raw.githubusercontent.com/api-evangelist/ringcentral/refs/heads/main/apis.yml
name: RingCentral
kind: company
description: >-
  RingCentral provides unified cloud communications for businesses including voice, video, messaging, contact center, and events. The RingCentral API exposes call control, SMS, faxing, voicemail, presence, team messaging, video, and analytics.
image: https://kinlane-productions.s3.amazonaws.com/apis-json/apis-json-logo.jpg
tags:
  - Communications
  - UCaaS
  - Voice
  - Video
  - Contact Center
  - SMS
  - Messaging
  - Fax
created: '2026-05-08'
modified: '2026-05-08'
specificationVersion: '0.19'
apis:
  - aid: ringcentral:ringcentral-voice-api
    name: RingCentral Voice API
    tags:
      - Voice
      - Telephony
      - Call Control
      - RingOut
    properties:
      - url: https://developers.ringcentral.com/voice-api
        type: Documentation
      - url: https://developers.ringcentral.com/api-reference/Call-Control
        type: APIReference
      - url: openapi/ringcentral-platform-openapi.yml
        type: OpenAPI
    description: >-
      The RingCentral Voice API enables developers to incorporate voice and phone functionality into applications. It supports placing calls (RingOut, WebRTC, URI scheme), call control (active call manipulation, transfer, hold, recording), call routing rules, monitoring, supervision, conferencing, and call log retrieval.
  - aid: ringcentral:ringcentral-sms-api
    name: RingCentral SMS API
    tags:
      - SMS
      - Messaging
      - A2P
      - Compliance
    properties:
      - url: https://developers.ringcentral.com/sms-api
        type: Documentation
      - url: https://developers.ringcentral.com/api-reference/SMS
        type: APIReference
    description: >-
      The RingCentral SMS API supports targeted and bulk SMS and MMS with deep insights and regulatory compliance built in. It supports sending and receiving messages, A2P 10DLC registration, message status reporting, and message store retrieval.
  - aid: ringcentral:ringcentral-team-messaging-api
    name: RingCentral Team Messaging API
    tags:
      - Team Messaging
      - Chat
      - Bots
      - Add-ins
    properties:
      - url: https://developers.ringcentral.com/team-messaging-api
        type: Documentation
      - url: https://developers.ringcentral.com/api-reference/Team-Messaging
        type: APIReference
    description: >-
      The RingCentral Team Messaging API enables developers to build chatbots, send notifications, and create add-ins within RingCentral Team Messaging (formerly Glip). It supports posting messages, managing chats, file attachments, persons/groups, events, webhooks, and adaptive cards.
  - aid: ringcentral:ringcentral-video-api
    name: RingCentral Video API
    tags:
      - Video
      - Meetings
      - Webinars
      - Conferencing
    properties:
      - url: https://developers.ringcentral.com/video-api
        type: Documentation
      - url: https://developers.ringcentral.com/api-reference/Video
        type: APIReference
    description: >-
      The RingCentral Video API powers high-quality, secure video meetings in the browser without requiring a downloaded app. It exposes endpoints for scheduling meetings, joining/embedding video sessions, managing recordings, and webhook events for meeting lifecycle.
  - aid: ringcentral:ringcentral-fax-api
    name: RingCentral Fax API
    tags:
      - Fax
      - Documents
    properties:
      - url: https://developers.ringcentral.com/fax-api
        type: Documentation
      - url: https://developers.ringcentral.com/api-reference/Fax
        type: APIReference
    description: >-
      The RingCentral Fax API enables developers to add programmable and customizable fax sending and receiving capabilities to applications, including multi-attachment support, scheduled delivery, and inbound fax retrieval.
  - aid: ringcentral:ringcentral-data-api
    name: RingCentral Data API
    tags:
      - Compliance
      - Data
      - Recordings
      - Exports
    properties:
      - url: https://developers.ringcentral.com/data-api
        type: Documentation
      - url: https://developers.ringcentral.com/api-reference/Compliance-Exports
        type: APIReference
    description: >-
      The RingCentral Data API helps customers manage and ensure regulatory compliance with call data, message data, and video recordings, supporting bulk export, archival, and supervisory retrieval workflows.
  - aid: ringcentral:ringcentral-ai-api
    name: RingCentral Audio and Video AI API
    tags:
      - AI
      - Transcription
      - Summarization
      - Speech-to-Text
    properties:
      - url: https://developers.ringcentral.com/ai-api
        type: Documentation
      - url: https://developers.ringcentral.com/api-reference/AI
        type: APIReference
    description: >-
      The RingCentral Audio and Video AI API exposes speech-to-text, summarization, and conversational analytics on call and meeting media, enabling developers to extract transcripts, action items, and insights from RingCentral communications.
  - aid: ringcentral:ringcentral-call-log-api
    name: RingCentral Call Log API
    tags:
      - Call Log
      - Analytics
      - History
    properties:
      - url: https://developers.ringcentral.com/api-reference/Call-Log
        type: APIReference
    description: >-
      The RingCentral Call Log API provides historical call data, recordings, and synchronization endpoints used to power analytics, billing, and compliance retention systems.
  - aid: ringcentral:ringcentral-call-analytics-api
    name: RingCentral Call Analytics API
    tags:
      - Analytics
      - KPIs
      - Reporting
    properties:
      - url: https://developers.ringcentral.com/api-reference/Analytics
        type: APIReference
    description: >-
      The RingCentral Call Analytics API exposes aggregated metrics, KPIs, and reporting endpoints for inbound and outbound calling activity at the user, queue, department, and account levels.
  - aid: ringcentral:ringcentral-presence-api
    name: RingCentral Presence API
    tags:
      - Presence
      - Status
      - Real-Time
    properties:
      - url: https://developers.ringcentral.com/api-reference/Presence
        type: APIReference
    description: >-
      The RingCentral Presence API exposes real-time and historical presence/availability state for users and call queues, including DND, telephony state, and meeting status, with subscription-based change notifications.
  - aid: ringcentral:ringcentral-voicemail-api
    name: RingCentral Voicemail API
    tags:
      - Voicemail
      - Messaging
    properties:
      - url: https://developers.ringcentral.com/api-reference/Voicemail
        type: APIReference
    description: >-
      The RingCentral Voicemail API enables retrieval, playback, and management of voicemail messages, including transcripts, attachments, and read/unread state.
  - aid: ringcentral:ringcentral-provisioning-api
    name: RingCentral Provisioning API
    tags:
      - Provisioning
      - Account
      - Extensions
      - Phone Numbers
    properties:
      - url: https://developers.ringcentral.com/api-reference/Account-Provisioning
        type: APIReference
    description: >-
      The RingCentral Provisioning API supports account, extension, user, phone-number, device, and role lifecycle operations needed to programmatically onboard, configure, and manage RingCentral tenants.
  - aid: ringcentral:ringcentral-webhooks-api
    name: RingCentral Webhooks and Subscriptions API
    tags:
      - Webhooks
      - Events
      - Subscriptions
      - PubNub
    properties:
      - url: https://developers.ringcentral.com/api-reference/Subscriptions
        type: APIReference
      - url: https://developers.ringcentral.com/guide/notifications
        type: Documentation
    description: >-
      The RingCentral Webhooks and Subscriptions API delivers event notifications (telephony, messaging, presence, account, etc.) to subscriber endpoints via webhooks or PubNub channels.
  - aid: ringcentral:ringcentral-contact-center-api
    name: RingCentral Contact Center API
    tags:
      - Contact Center
      - CCaaS
      - Agents
      - Routing
    properties:
      - url: https://developers.ringcentral.com/api-reference/Contact-Center
        type: APIReference
    description: >-
      The RingCentral Contact Center (RingCX) API provides programmatic access to omnichannel contact-center capabilities including agent state, queues, routing, real-time and historical reporting, and skills-based agent assignment.
  - aid: ringcentral:ringcentral-events-api
    name: RingCentral Events API
    tags:
      - Events
      - Webinars
      - Hub
    properties:
      - url: https://developers.ringcentral.com/api-reference/Events
        type: APIReference
    description: >-
      The RingCentral Events API supports the lifecycle of large-scale virtual and hybrid events including event creation, registration, sessions, sponsors, attendees, and reporting.
