  notes: >-
    RingCentral standardized on OAuth 2.0 (all password/ROPC flows retired). Access
    tokens are bearer tokens with a ~1 hour TTL; refresh tokens rotate. Documented
    grant types: Authorization Code (with PKCE) for user apps, JWT assertion (RFC
    7523) for server-only/no-UI apps, and Client Credentials for app-context calls.
    The public OpenAPI only encodes the authorizationCode scheme.
