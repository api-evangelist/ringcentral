format: ringcentral-error-envelope
notes: >-
  RingCentral does not use RFC 9457 application/problem+json (0 problem+json
  responses across the OpenAPI). Errors are returned in a custom envelope with an
  errors[] array; clients are instructed to branch on errorCode (a dotted PREFIX-NNN
  string), not the human message. HTTP status codes observed across 487 operations:
  400 (190), 401 (16), 403 (131), 404 (225), 406, 409 (27), 410, 415, 422, 429 (20),
  500 (187), 503 (123), 504.
envelope:
  content_type: application/json
  shape: |
    {
      "errorCode": "CMN-101",
      "message": "Parameter [xxx] value is invalid",
      "errors": [
        { "errorCode": "CMN-101", "message": "...", "parameterName": "xxx" }
      ]
    }
  primary_field: errorCode
  guidance: Branch on errorCode (and parameterName where present), never on message text.
error_code_prefixes:
  - prefix: CMN
    area: Common / platform-wide
  - prefix: OAU
    area: OAuth / authentication
  - prefix: MSG
    area: Messaging (SMS/MMS/pager)
  - prefix: TPS
    area: Throttling / rate policy service
