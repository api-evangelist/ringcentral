      - name: removeglipteammembersnew
        method: POST
        description: Remove Team Members
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
        inputParameters:
        - name: chatId
          in: path
          type: string
          description: Internal identifier of a team to remove members from.
          required: true
        - name: body
          in: body
          type: object
          description: Request body (JSON).
          required: true
    - name: team-messaging-v1-teams-chatId-unarchive
      path: /team-messaging/v1/teams/{chatId}/unarchive
      operations:
      - name: unarchiveglipteamnew
        method: POST
        description: Unarchive Team
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
        inputParameters:
        - name: chatId
          in: path
          type: string
          description: Internal identifier of a team to be made active.
          required: true
