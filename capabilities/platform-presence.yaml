    - path: /v1/restapi/v1-0/account/{accountid}/call-queues/{groupid}/presence
      name: restapi-v1-0-account-accountid-call-queues-groupid-presence
      description: REST surface for restapi-v1.0-account-accountId-call-queues-groupId-presence.
      operations:
      - method: GET
        name: readcallqueuepresence
        description: Get Call Queue Presence
        call: platform-presence.readcallqueuepresence
        with:
          groupId: rest.groupId
        outputParameters:
        - type: object
          mapping: $.
      - method: PUT
        name: updatecallqueuepresence
        description: Update Call Queue Presence
        call: platform-presence.updatecallqueuepresence
        with:
          groupId: rest.groupId
          body: rest.body
        outputParameters:
        - type: object
          mapping: $.
