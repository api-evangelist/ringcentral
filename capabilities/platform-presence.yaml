        name: readunifiedpresence
        description: Get Unified Presence
        call: platform-presence.readunifiedpresence
        with:
          accountId: rest.accountId
          extensionId: rest.extensionId
        outputParameters:
        - type: object
          mapping: $.
      - method: PATCH
        name: updateunifiedpresence
        description: Update Unified Presence
        call: platform-presence.updateunifiedpresence
        with:
          accountId: rest.accountId
          extensionId: rest.extensionId
          body: rest.body
        outputParameters:
        - type: object
          mapping: $.
    - path: /v1/restapi/v1-0/account/{accountid}/presence
      name: restapi-v1-0-account-accountid-presence
      description: REST surface for restapi-v1.0-account-accountId-presence.
      operations:
      - method: GET
        name: readaccountpresence
        description: Get User Presence Status List
        call: platform-presence.readaccountpresence
        with:
          detailedTelephonyState: rest.detailedTelephonyState
          sipData: rest.sipData
          page: rest.page
          perPage: rest.perPage
        outputParameters:
        - type: object
          mapping: $.
  - type: mcp
    namespace: platform-presence-mcp
    port: 9090
    transport: http
    description: MCP adapter for RingCentral API — Presence. One tool per consumed operation, routed inline through this capability's
      consumes block.
    tools:
    - name: get-call-queue-presence
      description: Get Call Queue Presence
