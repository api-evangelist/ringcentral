      - method: PUT
        name: updateuserpresencestatus
        description: Update User Presence Status
        call: platform-presence.updateuserpresencestatus
        with:
          body: rest.body
        outputParameters:
        - type: object
          mapping: $.
    - path: /v1/restapi/v1-0/account/{accountid}/extension/{extensionid}/unified-presence
      name: restapi-v1-0-account-accountid-extension-extensionid-unified-presence
      description: REST surface for restapi-v1.0-account-accountId-extension-extensionId-unified-presence.
      operations:
