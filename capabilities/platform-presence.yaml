        call: platform-presence.readextensioncallqueuepresence
        with:
          editableMemberStatus: rest.editableMemberStatus
        outputParameters:
        - type: object
          mapping: $.
      - method: PUT
        name: updateextensioncallqueuepresence
        description: Update Call Queue Presence
        call: platform-presence.updateextensioncallqueuepresence
        with:
          body: rest.body
        outputParameters:
        - type: object
          mapping: $.
    - path: /v1/restapi/v1-0/account/{accountid}/extension/{extensionid}/presence
      name: restapi-v1-0-account-accountid-extension-extensionid-presence
      description: REST surface for restapi-v1.0-account-accountId-extension-extensionId-presence.
      operations:
      - method: GET
        name: readuserpresencestatus
        description: Get User Presence Status
