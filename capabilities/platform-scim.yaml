        description: Get Resource Type
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
        inputParameters:
        - name: type
          in: path
          type: string
          description: Resource type
          required: true
    - name: scim-v2-Schemas
      path: /scim/v2/Schemas
