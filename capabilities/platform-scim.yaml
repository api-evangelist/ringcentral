        description: Search/List Users
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
        inputParameters:
        - name: filter
          in: query
          type: string
          description: Only support 'userName' or 'email' filter expressions for now
        - name: startIndex
          in: query
          type: integer
          description: Start index (1-based)
        - name: count
          in: query
