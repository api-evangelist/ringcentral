    port: 9090
    transport: http
    description: MCP adapter for RingCentral API — Pager Messages. One tool per consumed operation, routed inline through
      this capability's consumes block.
    tools:
    - name: create-internal-text-message
      description: Create Internal Text Message
      hints:
        readOnly: false
        destructive: false
        idempotent: false
      call: platform-pager-messages.createinternaltextmessage
      with:
        body: tools.body
      outputParameters:
      - type: object
        mapping: $.
