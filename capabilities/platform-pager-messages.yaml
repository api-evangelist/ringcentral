    baseUri: https://platform.ringcentral.com
    description: RingCentral API — Pager Messages business capability. Self-contained, no shared references.
    resources:
    - name: restapi-v1.0-account-accountId-extension-extensionId-company-pager
      path: /restapi/v1.0/account/{accountId}/extension/{extensionId}/company-pager
      operations:
      - name: createinternaltextmessage
        method: POST
        description: Create Internal Text Message
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
        inputParameters:
        - name: body
          in: body
          type: object
          description: Request body (JSON).
          required: true
    authentication:
      type: bearer
      token: '{{env.RINGCENTRAL_API_KEY}}'
  exposes:
