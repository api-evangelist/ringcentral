    namespace: platform-pager-messages-rest
    port: 8080
    description: REST adapter for RingCentral API — Pager Messages. One Spectral-compliant resource per consumed operation,
      prefixed with /v1.
    resources:
    - path: /v1/restapi/v1-0/account/{accountid}/extension/{extensionid}/company-pager
      name: restapi-v1-0-account-accountid-extension-extensionid-company-pager
      description: REST surface for restapi-v1.0-account-accountId-extension-extensionId-company-pager.
      operations:
      - method: POST
        name: createinternaltextmessage
        description: Create Internal Text Message
        call: platform-pager-messages.createinternaltextmessage
        with:
          body: rest.body
        outputParameters:
        - type: object
          mapping: $.
