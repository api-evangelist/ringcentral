naftiko: 1.0.0-alpha2
info:
  label: RingCentral API — Paging Only Groups
  description: 'RingCentral API — Paging Only Groups. 3 operations. Lead operation: Assign Paging Group Users and Devices.
    Self-contained Naftiko capability covering one Ringcentral business surface.'
  tags:
  - Ringcentral
  - Paging Only Groups
  created: '2026-05-19'
  modified: '2026-05-19'
binds:
- namespace: env
  keys:
    RINGCENTRAL_API_KEY: RINGCENTRAL_API_KEY
capability:
  consumes:
  - type: http
    namespace: platform-paging-only-groups
    baseUri: https://platform.ringcentral.com
    description: RingCentral API — Paging Only Groups business capability. Self-contained, no shared references.
    resources:
    - name: restapi-v1.0-account-accountId-paging-only-groups-pagingOnlyGroupId-bulk-assign
      path: /restapi/v1.0/account/{accountId}/paging-only-groups/{pagingOnlyGroupId}/bulk-assign
      operations:
      - name: assignmultiplepaginggroupusersdevices
        method: POST
        description: Assign Paging Group Users and Devices
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
        inputParameters:
        - name: pagingOnlyGroupId
          in: path
          type: string
          description: Internal identifier of a paging group
          required: true
        - name: body
          in: body
          type: object
          description: Request body (JSON).
          required: false
    - name: restapi-v1.0-account-accountId-paging-only-groups-pagingOnlyGroupId-devices
      path: /restapi/v1.0/account/{accountId}/paging-only-groups/{pagingOnlyGroupId}/devices
      operations:
      - name: listpaginggroupdevices
        method: GET
        description: Get Paging Group Devices
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
        inputParameters:
        - name: pagingOnlyGroupId
          in: path
          type: string
          description: Internal identifier of a paging group
          required: true
        - name: page
          in: query
          type: integer
          description: Indicates a page number to retrieve. Only positive number values
        - name: perPage
          in: query
          type: integer
          description: Indicates a page size (number of items)
    - name: restapi-v1.0-account-accountId-paging-only-groups-pagingOnlyGroupId-users
      path: /restapi/v1.0/account/{accountId}/paging-only-groups/{pagingOnlyGroupId}/users
      operations:
      - name: listpaginggroupusers
        method: GET
        description: Get Paging Group Users
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
        inputParameters:
        - name: pagingOnlyGroupId
          in: path
          type: string
          description: Internal identifier of a paging group
          required: true
        - name: page
          in: query
          type: integer
          description: Indicates a page number to retrieve. Only positive number values
        - name: perPage
          in: query
          type: integer
          description: Indicates a page size (number of items)
    authentication:
      type: bearer
      token: '{{env.RINGCENTRAL_API_KEY}}'
  exposes:
  - type: rest
    namespace: platform-paging-only-groups-rest
    port: 8080
    description: REST adapter for RingCentral API — Paging Only Groups. One Spectral-compliant resource per consumed operation,
      prefixed with /v1.
    resources:
    - path: /v1/restapi/v1-0/account/{accountid}/paging-only-groups/{pagingonlygroupid}/bulk-assign
      name: restapi-v1-0-account-accountid-paging-only-groups-pagingonlygroupid-bulk-assign
      description: REST surface for restapi-v1.0-account-accountId-paging-only-groups-pagingOnlyGroupId-bulk-assign.
      operations:
      - method: POST
        name: assignmultiplepaginggroupusersdevices
        description: Assign Paging Group Users and Devices
        call: platform-paging-only-groups.assignmultiplepaginggroupusersdevices
        with:
          pagingOnlyGroupId: rest.pagingOnlyGroupId
          body: rest.body
        outputParameters:
        - type: object
          mapping: $.
    - path: /v1/restapi/v1-0/account/{accountid}/paging-only-groups/{pagingonlygroupid}/devices
      name: restapi-v1-0-account-accountid-paging-only-groups-pagingonlygroupid-devices
      description: REST surface for restapi-v1.0-account-accountId-paging-only-groups-pagingOnlyGroupId-devices.
      operations:
      - method: GET
        name: listpaginggroupdevices
        description: Get Paging Group Devices
        call: platform-paging-only-groups.listpaginggroupdevices
        with:
          pagingOnlyGroupId: rest.pagingOnlyGroupId
          page: rest.page
          perPage: rest.perPage
        outputParameters:
        - type: object
          mapping: $.
    - path: /v1/restapi/v1-0/account/{accountid}/paging-only-groups/{pagingonlygroupid}/users
      name: restapi-v1-0-account-accountid-paging-only-groups-pagingonlygroupid-users
      description: REST surface for restapi-v1.0-account-accountId-paging-only-groups-pagingOnlyGroupId-users.
      operations:
      - method: GET
        name: listpaginggroupusers
        description: Get Paging Group Users
        call: platform-paging-only-groups.listpaginggroupusers
        with:
          pagingOnlyGroupId: rest.pagingOnlyGroupId
          page: rest.page
          perPage: rest.perPage
        outputParameters:
        - type: object
          mapping: $.
  - type: mcp
    namespace: platform-paging-only-groups-mcp
    port: 9090
    transport: http
    description: MCP adapter for RingCentral API — Paging Only Groups. One tool per consumed operation, routed inline through
      this capability's consumes block.
    tools:
    - name: assign-paging-group-users-and
      description: Assign Paging Group Users and Devices
      hints:
        readOnly: false
        destructive: false
        idempotent: false
      call: platform-paging-only-groups.assignmultiplepaginggroupusersdevices
      with:
        pagingOnlyGroupId: tools.pagingOnlyGroupId
        body: tools.body
      outputParameters:
      - type: object
        mapping: $.
    - name: get-paging-group-devices
      description: Get Paging Group Devices
      hints:
        readOnly: true
        destructive: false
        idempotent: true
      call: platform-paging-only-groups.listpaginggroupdevices
      with:
        pagingOnlyGroupId: tools.pagingOnlyGroupId
        page: tools.page
        perPage: tools.perPage
      outputParameters:
      - type: object
        mapping: $.
    - name: get-paging-group-users
      description: Get Paging Group Users
      hints:
        readOnly: true
        destructive: false
        idempotent: true
      call: platform-paging-only-groups.listpaginggroupusers
      with:
        pagingOnlyGroupId: tools.pagingOnlyGroupId
        page: tools.page
        perPage: tools.perPage
      outputParameters:
      - type: object
        mapping: $.
