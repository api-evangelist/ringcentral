      operations:
      - name: readsite
        method: GET
        description: Get Site
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
        inputParameters:
        - name: siteId
          in: path
          type: string
          description: Internal identifier of a site. *Please note* that `siteId` cannot take the 'main-site' value
          required: true
      - name: updatesite
        method: PUT
        description: Update Site
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
        inputParameters:
