        method: GET
        description: List Site Members
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
        inputParameters:
        - name: siteId
          in: path
          type: string
          description: Internal identifier of a site. *Please note* that `siteId` cannot take the 'main-site' value
          required: true
