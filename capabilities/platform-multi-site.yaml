          required: true
        - name: body
          in: body
          type: object
          description: Request body (JSON).
          required: false
      - name: deletesite
        method: DELETE
        description: Delete Site
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
        inputParameters:
        - name: siteId
          in: path
          type: string
          description: Internal identifier of a site. *Please note* that `siteId` cannot take the 'main-site' value
          required: true
