naftiko: 1.0.0-alpha2
info:
  label: RingCentral API — Delegation Management
  description: 'RingCentral API — Delegation Management. 1 operations. Lead operation: Get Delegators. Self-contained Naftiko
    capability covering one Ringcentral business surface.'
  tags:
  - Ringcentral
  - Delegation Management
  created: '2026-05-19'
  modified: '2026-05-19'
binds:
- namespace: env
  keys:
    RINGCENTRAL_API_KEY: RINGCENTRAL_API_KEY
capability:
  consumes:
  - type: http
    namespace: platform-delegation-management
    baseUri: https://platform.ringcentral.com
    description: RingCentral API — Delegation Management business capability. Self-contained, no shared references.
    resources:
    - name: rcvideo-v1-accounts-accountId-extensions-extensionId-delegators
      path: /rcvideo/v1/accounts/{accountId}/extensions/{extensionId}/delegators
      operations:
      - name: rcvlistdelegators
        method: GET
        description: Get Delegators
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
        inputParameters:
        - name: accountId
          in: path
          type: string
          required: true
        - name: extensionId
          in: path
          type: string
          required: true
    authentication:
      type: bearer
      token: '{{env.RINGCENTRAL_API_KEY}}'
  exposes:
  - type: rest
    namespace: platform-delegation-management-rest
    port: 8080
    description: REST adapter for RingCentral API — Delegation Management. One Spectral-compliant resource per consumed operation,
      prefixed with /v1.
    resources:
    - path: /v1/rcvideo/v1/accounts/{accountid}/extensions/{extensionid}/delegators
      name: rcvideo-v1-accounts-accountid-extensions-extensionid-delegators
      description: REST surface for rcvideo-v1-accounts-accountId-extensions-extensionId-delegators.
      operations:
      - method: GET
        name: rcvlistdelegators
        description: Get Delegators
        call: platform-delegation-management.rcvlistdelegators
        with:
          accountId: rest.accountId
          extensionId: rest.extensionId
        outputParameters:
        - type: object
          mapping: $.
  - type: mcp
    namespace: platform-delegation-management-mcp
    port: 9090
    transport: http
    description: MCP adapter for RingCentral API — Delegation Management. One tool per consumed operation, routed inline through
      this capability's consumes block.
    tools:
    - name: get-delegators
      description: Get Delegators
      hints:
        readOnly: true
        destructive: false
        idempotent: true
      call: platform-delegation-management.rcvlistdelegators
      with:
        accountId: tools.accountId
        extensionId: tools.extensionId
      outputParameters:
      - type: object
        mapping: $.
