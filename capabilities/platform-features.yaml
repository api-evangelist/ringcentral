naftiko: 1.0.0-alpha2
info:
  label: RingCentral API — Features
  description: 'RingCentral API — Features. 1 operations. Lead operation: Get User Features. Self-contained Naftiko capability
    covering one Ringcentral business surface.'
  tags:
  - Ringcentral
  - Features
  created: '2026-05-19'
  modified: '2026-05-19'
binds:
- namespace: env
  keys:
    RINGCENTRAL_API_KEY: RINGCENTRAL_API_KEY
capability:
  consumes:
  - type: http
    namespace: platform-features
    baseUri: https://platform.ringcentral.com
    description: RingCentral API — Features business capability. Self-contained, no shared references.
    resources:
    - name: restapi-v1.0-account-accountId-extension-extensionId-features
      path: /restapi/v1.0/account/{accountId}/extension/{extensionId}/features
      operations:
      - name: readextensionfeatures
        method: GET
        description: Get User Features
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
        inputParameters:
        - name: availableOnly
          in: query
          type: boolean
          description: Allows to filter features by availability for an extension
        - name: featureId
          in: query
          type: array
          description: Internal identifier(s) of the feature(s)
    authentication:
      type: bearer
      token: '{{env.RINGCENTRAL_API_KEY}}'
  exposes:
  - type: rest
    namespace: platform-features-rest
    port: 8080
    description: REST adapter for RingCentral API — Features. One Spectral-compliant resource per consumed operation, prefixed
      with /v1.
    resources:
    - path: /v1/restapi/v1-0/account/{accountid}/extension/{extensionid}/features
      name: restapi-v1-0-account-accountid-extension-extensionid-features
      description: REST surface for restapi-v1.0-account-accountId-extension-extensionId-features.
      operations:
      - method: GET
        name: readextensionfeatures
        description: Get User Features
        call: platform-features.readextensionfeatures
        with:
          availableOnly: rest.availableOnly
          featureId: rest.featureId
        outputParameters:
        - type: object
          mapping: $.
  - type: mcp
    namespace: platform-features-mcp
    port: 9090
    transport: http
    description: MCP adapter for RingCentral API — Features. One tool per consumed operation, routed inline through this capability's
      consumes block.
    tools:
    - name: get-user-features
      description: Get User Features
      hints:
        readOnly: true
        destructive: false
        idempotent: true
      call: platform-features.readextensionfeatures
      with:
        availableOnly: tools.availableOnly
        featureId: tools.featureId
      outputParameters:
      - type: object
        mapping: $.
