naftiko: 1.0.0-alpha2
info:
  label: RingCentral API — Audit Trail
  description: 'RingCentral API — Audit Trail. 1 operations. Lead operation: Search Audit Trail Data. Self-contained Naftiko
    capability covering one Ringcentral business surface.'
  tags:
  - Ringcentral
  - Audit Trail
  created: '2026-05-19'
  modified: '2026-05-19'
binds:
- namespace: env
  keys:
    RINGCENTRAL_API_KEY: RINGCENTRAL_API_KEY
capability:
  consumes:
  - type: http
    namespace: platform-audit-trail
    baseUri: https://platform.ringcentral.com
    description: RingCentral API — Audit Trail business capability. Self-contained, no shared references.
    resources:
    - name: restapi-v1.0-account-accountId-audit-trail-search
      path: /restapi/v1.0/account/{accountId}/audit-trail/search
      operations:
      - name: audittrailsearch
        method: POST
        description: Search Audit Trail Data
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
        inputParameters:
        - name: body
          in: body
          type: object
          description: Request body (JSON).
          required: false
    authentication:
      type: bearer
      token: '{{env.RINGCENTRAL_API_KEY}}'
  exposes:
  - type: rest
    namespace: platform-audit-trail-rest
    port: 8080
    description: REST adapter for RingCentral API — Audit Trail. One Spectral-compliant resource per consumed operation, prefixed
      with /v1.
    resources:
    - path: /v1/restapi/v1-0/account/{accountid}/audit-trail/search
      name: restapi-v1-0-account-accountid-audit-trail-search
      description: REST surface for restapi-v1.0-account-accountId-audit-trail-search.
      operations:
      - method: POST
        name: audittrailsearch
        description: Search Audit Trail Data
        call: platform-audit-trail.audittrailsearch
        with:
          body: rest.body
        outputParameters:
        - type: object
          mapping: $.
  - type: mcp
    namespace: platform-audit-trail-mcp
    port: 9090
    transport: http
    description: MCP adapter for RingCentral API — Audit Trail. One tool per consumed operation, routed inline through this
      capability's consumes block.
    tools:
    - name: search-audit-trail-data
      description: Search Audit Trail Data
      hints:
        readOnly: true
        destructive: false
        idempotent: false
      call: platform-audit-trail.audittrailsearch
      with:
        body: tools.body
      outputParameters:
      - type: object
        mapping: $.
