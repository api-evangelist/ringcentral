naftiko: 1.0.0-alpha2
info:
  label: RingCentral API — Historical Recordings
  description: 'RingCentral API — Historical Recordings. 5 operations. Lead operation: List Webinar Recordings (Admin). Self-contained
    Naftiko capability covering one Ringcentral business surface.'
  tags:
  - Ringcentral
  - Historical Recordings
  created: '2026-05-19'
  modified: '2026-05-19'
binds:
- namespace: env
  keys:
    RINGCENTRAL_API_KEY: RINGCENTRAL_API_KEY
capability:
  consumes:
  - type: http
    namespace: platform-historical-recordings
    baseUri: https://platform.ringcentral.com
    description: RingCentral API — Historical Recordings business capability. Self-contained, no shared references.
    resources:
    - name: webinar-history-v1-company-recordings
      path: /webinar/history/v1/company/recordings
      operations:
      - name: rcwhistoryadminlistrecordings
        method: GET
        description: List Webinar Recordings (Admin)
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
        inputParameters:
        - name: nameFragment
          in: query
          type: string
          description: Filter to return only webinar recordings containing particular substring within their names
    - name: webinar-history-v1-company-recordings-recordingId
      path: /webinar/history/v1/company/recordings/{recordingId}
      operations:
      - name: rcwhistoryadmingetrecording
        method: GET
        description: Get Webinar Recording (Admin)
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
    - name: webinar-history-v1-recordings
      path: /webinar/history/v1/recordings
      operations:
      - name: rcwhistorylistrecordings
        method: GET
        description: List Webinar Recordings
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
    - name: webinar-history-v1-recordings-recordingId
      path: /webinar/history/v1/recordings/{recordingId}
      operations:
      - name: rcwhistorygetrecording
        method: GET
        description: Get Webinar Recording
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
    - name: webinar-history-v1-recordings-recordingId-download
      path: /webinar/history/v1/recordings/{recordingId}/download
      operations:
      - name: rcwhistorygetrecordingdownload
        method: GET
        description: Get Webinar Recording Download Resource
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
    authentication:
      type: bearer
      token: '{{env.RINGCENTRAL_API_KEY}}'
  exposes:
  - type: rest
    namespace: platform-historical-recordings-rest
    port: 8080
    description: REST adapter for RingCentral API — Historical Recordings. One Spectral-compliant resource per consumed operation,
      prefixed with /v1.
    resources:
    - path: /v1/webinar/history/v1/company/recordings
      name: webinar-history-v1-company-recordings
      description: REST surface for webinar-history-v1-company-recordings.
      operations:
      - method: GET
        name: rcwhistoryadminlistrecordings
        description: List Webinar Recordings (Admin)
        call: platform-historical-recordings.rcwhistoryadminlistrecordings
        with:
          nameFragment: rest.nameFragment
        outputParameters:
        - type: object
          mapping: $.
    - path: /v1/webinar/history/v1/company/recordings/{recordingid}
      name: webinar-history-v1-company-recordings-recordingid
      description: REST surface for webinar-history-v1-company-recordings-recordingId.
      operations:
      - method: GET
        name: rcwhistoryadmingetrecording
        description: Get Webinar Recording (Admin)
        call: platform-historical-recordings.rcwhistoryadmingetrecording
        outputParameters:
        - type: object
          mapping: $.
    - path: /v1/webinar/history/v1/recordings
      name: webinar-history-v1-recordings
      description: REST surface for webinar-history-v1-recordings.
      operations:
      - method: GET
        name: rcwhistorylistrecordings
        description: List Webinar Recordings
        call: platform-historical-recordings.rcwhistorylistrecordings
        outputParameters:
        - type: object
          mapping: $.
    - path: /v1/webinar/history/v1/recordings/{recordingid}
      name: webinar-history-v1-recordings-recordingid
      description: REST surface for webinar-history-v1-recordings-recordingId.
      operations:
      - method: GET
        name: rcwhistorygetrecording
        description: Get Webinar Recording
        call: platform-historical-recordings.rcwhistorygetrecording
        outputParameters:
        - type: object
          mapping: $.
    - path: /v1/webinar/history/v1/recordings/{recordingid}/download
      name: webinar-history-v1-recordings-recordingid-download
      description: REST surface for webinar-history-v1-recordings-recordingId-download.
      operations:
      - method: GET
        name: rcwhistorygetrecordingdownload
        description: Get Webinar Recording Download Resource
        call: platform-historical-recordings.rcwhistorygetrecordingdownload
        outputParameters:
        - type: object
          mapping: $.
  - type: mcp
    namespace: platform-historical-recordings-mcp
    port: 9090
    transport: http
    description: MCP adapter for RingCentral API — Historical Recordings. One tool per consumed operation, routed inline through
      this capability's consumes block.
    tools:
    - name: list-webinar-recordings-admin
      description: List Webinar Recordings (Admin)
      hints:
        readOnly: true
        destructive: false
        idempotent: true
      call: platform-historical-recordings.rcwhistoryadminlistrecordings
      with:
        nameFragment: tools.nameFragment
      outputParameters:
      - type: object
        mapping: $.
    - name: get-webinar-recording-admin
      description: Get Webinar Recording (Admin)
      hints:
        readOnly: true
        destructive: false
        idempotent: true
      call: platform-historical-recordings.rcwhistoryadmingetrecording
      outputParameters:
      - type: object
        mapping: $.
    - name: list-webinar-recordings
      description: List Webinar Recordings
      hints:
        readOnly: true
        destructive: false
        idempotent: true
      call: platform-historical-recordings.rcwhistorylistrecordings
      outputParameters:
      - type: object
        mapping: $.
    - name: get-webinar-recording
      description: Get Webinar Recording
      hints:
        readOnly: true
        destructive: false
        idempotent: true
      call: platform-historical-recordings.rcwhistorygetrecording
      outputParameters:
      - type: object
        mapping: $.
    - name: get-webinar-recording-download-resource
      description: Get Webinar Recording Download Resource
      hints:
        readOnly: true
        destructive: false
        idempotent: true
      call: platform-historical-recordings.rcwhistorygetrecordingdownload
      outputParameters:
      - type: object
        mapping: $.
