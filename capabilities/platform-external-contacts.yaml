          in: query
          type: string
          description: If specified, only contacts which 'First name' or 'Last name' start
        - name: sortBy
          in: query
          type: array
          description: Sorts results by the specified property
        - name: phoneNumber
          in: query
          type: array
          description: Phone number in e.164 format
      - name: createcontact
        method: POST
        description: Create User Contact
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
        inputParameters:
        - name: dialingPlan
          in: query
          type: string
          description: Country code value complying with the [ISO 3166-1 alpha-2](https://ru.wikipedia.org/wiki/ISO_3166-1_alpha-2)
        - name: body
          in: body
          type: object
          description: Request body (JSON).
          required: true
