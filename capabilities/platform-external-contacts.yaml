          in: query
          type: string
          description: 'Country code value complying with the [ISO 3166-1 alpha-2](https://ru.wikipedia.org/wiki/ISO_3166-1_alpha-2)
            format. '
        - name: body
          in: body
          type: object
          description: Request body (JSON).
          required: true
      - name: patchcontact
        method: PATCH
        description: Update Contact Attributes
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
        inputParameters:
        - name: dialingPlan
          in: query
          type: string
          description: Country code value complying with the [ISO 3166-1 alpha-2](https://ru.wikipedia.org/wiki/ISO_3166-1_alpha-2)
        - name: body
          in: body
          type: object
          description: Request body (JSON).
          required: true
      - name: deletecontact
        method: DELETE
        description: Delete User Contact(s)
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
