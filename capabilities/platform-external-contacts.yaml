      operations:
      - name: addressbookbulkupload
        method: POST
        description: Upload Multiple User Contacts
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
        inputParameters:
        - name: body
          in: body
          type: object
          description: Request body (JSON).
          required: true
    - name: restapi-v1.0-account-accountId-address-book-bulk-upload-tasks-taskId
