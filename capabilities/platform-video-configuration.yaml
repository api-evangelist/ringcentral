naftiko: 1.0.0-alpha2
info:
  label: RingCentral API — Video Configuration
  description: 'RingCentral API — Video Configuration. 1 operations. Lead operation: Get User Video Configuration. Self-contained
    Naftiko capability covering one Ringcentral business surface.'
  tags:
  - Ringcentral
  - Video Configuration
  created: '2026-05-19'
  modified: '2026-05-19'
binds:
- namespace: env
  keys:
    RINGCENTRAL_API_KEY: RINGCENTRAL_API_KEY
capability:
  consumes:
  - type: http
    namespace: platform-video-configuration
    baseUri: https://platform.ringcentral.com
    description: RingCentral API — Video Configuration business capability. Self-contained, no shared references.
    resources:
    - name: restapi-v1.0-account-accountId-extension-extensionId-video-configuration
      path: /restapi/v1.0/account/{accountId}/extension/{extensionId}/video-configuration
      operations:
      - name: readuservideoconfiguration
        method: GET
        description: Get User Video Configuration
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
    authentication:
      type: bearer
      token: '{{env.RINGCENTRAL_API_KEY}}'
  exposes:
  - type: rest
    namespace: platform-video-configuration-rest
    port: 8080
    description: REST adapter for RingCentral API — Video Configuration. One Spectral-compliant resource per consumed operation,
      prefixed with /v1.
    resources:
    - path: /v1/restapi/v1-0/account/{accountid}/extension/{extensionid}/video-configuration
      name: restapi-v1-0-account-accountid-extension-extensionid-video-configuration
      description: REST surface for restapi-v1.0-account-accountId-extension-extensionId-video-configuration.
      operations:
      - method: GET
        name: readuservideoconfiguration
        description: Get User Video Configuration
        call: platform-video-configuration.readuservideoconfiguration
        outputParameters:
        - type: object
          mapping: $.
  - type: mcp
    namespace: platform-video-configuration-mcp
    port: 9090
    transport: http
    description: MCP adapter for RingCentral API — Video Configuration. One tool per consumed operation, routed inline through
      this capability's consumes block.
    tools:
    - name: get-user-video-configuration
      description: Get User Video Configuration
      hints:
        readOnly: true
        destructive: false
        idempotent: true
      call: platform-video-configuration.readuservideoconfiguration
      outputParameters:
      - type: object
        mapping: $.
