generated: '2026-06-20'
method: searched
source: https://developers.ringcentral.com/embeddable-voice
description: >-
  Client-side / embeddable UI components RingCentral publishes for dropping a
  full phone, dialer, and CTI surface into any web page or CRM without building
  a UI from the REST API. Distinct from the server-side SDKs in packages/.
families:
  - name: RingCentral Embeddable
    kind: embeddable-widget
    description: >-
      Open-source, fully functional embeddable phone / CTI web widget added to any
      page via a script tag or adapter, with WebRTC calling, SMS, presence, call
      log, and glip. Extensible via CSS and JS events; 2.x supports custom tabs and
      pages via a JSON schema.
    docs: https://developers.ringcentral.com/embeddable-voice
    demo: https://ringcentral.github.io/ringcentral-embeddable/
    repo: https://github.com/ringcentral/ringcentral-embeddable
    marketplace: https://apps.ringcentral.com/integration/ringcentral-embeddable/latest/
    loaders:
      - type: script-adapter
        url: https://apps.ringcentral.com/integration/ringcentral-embeddable/latest/adapter.js
    embed_methods:
      - Inject adapter.js via a small JS snippet in the page header (no HTML/CSS edits).
      - Iframe widget hosted at apps.ringcentral.com.
    extensibility:
      - Listen to widget events and post messages over the RingCentral Client API (JS).
      - Register custom tabs/pages (Embeddable 2.x) via JSON schema.
  - name: Embeddable Extension Factory
    kind: cli-scaffold
    description: >-
      CLI tool that generates a Chrome/Firefox browser extension embedding the
      RingCentral Embeddable widget into CRM sites.
    repo: https://github.com/ringcentral/ringcentral-embeddable-extension-factory
    install: npx ringcentral-embeddable-extension-factory
  - name: Open CTI / Call Center Adapter
    kind: cti-adapter
    description: >-
      RingCentral Embeddable configured as an Open CTI adapter for CRM platforms
      such as Salesforce Lightning, providing click-to-dial and screen-pop.
    docs: https://ringcentral-tutorials.github.io/ringcentral-embeddable-demos/
